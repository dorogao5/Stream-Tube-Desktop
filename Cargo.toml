[package]
name = "streamtube"
version = "0.7.2-alpha"
edition = "2024"
description = "A YouTube desktop client in Rust + GPUI with SponsorBlock, DeArrow, RYD, local subscriptions & more"
license = "MIT"

[dependencies]
gpui-kit = "0.10"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json", "socks-proxy"] }
rusqlite = { version = "0.43", features = ["bundled"] }
parking_lot = "0.12"
sha2 = "0.11"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "6"
libloading = "0.9"
image = { version = "0.25", default-features = false }
futures = "0.3"
smallvec = "1"
rand = "0.9"
open = "5"
raw-window-handle = "0.6"
sha1 = "0.11"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Compile GPUI shaders at launch so the app can build with Command Line Tools.
gpui-pre-macos = { version = "=0.3.12", default-features = false, features = ["runtime_shaders"] }
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
# Use the same GPUI engine as gpui-kit for headless player tests.
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }

# GPUI's Windows text backend with one fix: right-to-left text (Arabic, Hebrew)
# was drawn mirrored. See vendor/gpui-pre-windows/PATCHES.md.
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
